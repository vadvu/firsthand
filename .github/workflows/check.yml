name: macOS and Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies and create local watchlist
        run: Rscript firsthand.R setup --no-command
      - name: Offline regression checks
        run: Rscript checks.R
      - name: macOS entry point
        if: runner.os == 'macOS'
        run: sh firsthand.sh help
      - name: Windows entry point
        if: runner.os == 'Windows'
        run: .\firsthand.cmd help
